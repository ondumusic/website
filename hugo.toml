baseURL = "/"
title = "Ondu"
locale = "en"
uglyURLs = true   # use setup.html as url
disableKinds = ["taxonomy", "term", "rss"]

[params]
  tagline = "your own music library on iPhone and Mac"
  description = """\
    A music player for iPhone and Mac that plays your own collection \
    from a server you run yourself."""
  author = "The Ondu Contributors"   # footer copyright, matches the LICENSE
  publisher = "Max"   # the "I" in the privacy policy and terms
  email = "support@ondumusic.com"
  appStoreURL = ""
  testflightURL = ""
  github = "https://github.com/ondumusic"
  serverRepo = "https://github.com/ondumusic/server"

[menus]
  [[menus.main]]
    name = "Setup"
    pageRef = "/setup"
    weight = 1
  [[menus.main]]
    name = "FAQ"
    pageRef = "/faq"
    weight = 2
  [[menus.main]]
    name = "API"
    pageRef = "/api"
    weight = 3
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 4

  [[menus.footer]]
    name = "Docs"
    identifier = "docs"
    weight = 1
  [[menus.footer]]
    name = "Project"
    identifier = "project"
    weight = 2
  [[menus.footer]]
    name = "Legal"
    identifier = "legal"
    weight = 3

  [[menus.footer]]
    name = "Setup"
    pageRef = "/setup"
    parent = "docs"
    weight = 1
  [[menus.footer]]
    name = "Configuration"
    pageRef = "/config"
    parent = "docs"
    weight = 2
  [[menus.footer]]
    name = "API"
    pageRef = "/api"
    parent = "docs"
    weight = 3
  [[menus.footer]]
    name = "FAQ"
    pageRef = "/faq"
    parent = "docs"
    weight = 4
  [[menus.footer]]
    name = "About"
    pageRef = "/about"
    parent = "project"
    weight = 1
  [[menus.footer]]
    name = "Privacy"
    pageRef = "/privacy"
    parent = "legal"
    weight = 1
  [[menus.footer]]
    name = "Terms"
    pageRef = "/terms"
    parent = "legal"
    weight = 2

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.parser.attribute]
    block = true
  [markup.highlight]
    codeFences = false

[security]
  allowContent = ['^text/html$', '^text/markdown$']
